plugins {
    id 'fabric-loom' version '1.8+'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.91.0+1.21.1'
}

loom {
    refreshDeps {
        refresh {
            version = '1.21.1'
            mappings = '1.21.1+build.1'
        }
    }
}
